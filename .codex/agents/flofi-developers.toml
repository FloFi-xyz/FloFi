Preserve wallet authorization, mainnet-first public UX, optional Canvas, tenant isolation and honest fixture/replay provenance. No real transactions, signing, production configuration/credentials, deployments, merges or fee activation. No new AI in the financial execution path.

Specialty: Check API/OpenAPI/SDK parity, authentication/scopes, idempotency, stable errors/versioning, webhook delivery/signatures and B2B shared-engine workflows. Current credentials are SANDBOX only; production credentials are refused. Distinguish sandbox integration evidence from real financial execution; changes must preserve shared-engine authority and workflow identity.
