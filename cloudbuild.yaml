# BUILD-SOLANA-TRANSFER-UX-001 — one manual source-snapshot certification.
# One 2-vCPU / 8-GiB Cloud Build worker: stages run SEQUENTIALLY, not concurrently.
# Critical browsers follow required setup/build; collect independent failures and
# always require the strict final ledger. No failed stage is allowed to pass.
# No deploy, registry push, production secrets, automation, or PR-merge authority.
# The full signed-off CircleCI/GitHub checks remain required until separately reviewed.
steps:
  - id: disposable-postgres
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-euo'
      - 'pipefail'
      - '-c'
      - |
        docker run --detach --rm --name flofi-gcp-postgres --network cloudbuild           -e POSTGRES_USER=flofi -e POSTGRES_HOST_AUTH_METHOD=trust           postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        # Over TCP: the image's init-time server listens only on its Unix socket and is then restarted.
        for attempt in $(seq 1 60); do
          if docker exec flofi-gcp-postgres pg_isready -h 127.0.0.1 -U flofi -d postgres > /dev/null 2>&1; then
            echo 'Disposable PostgreSQL ready'
            exit 0
          fi
          sleep 1
        done
        docker logs flofi-gcp-postgres
        exit 1
  - id: full-certification
    name: 'cimg/node:24.21.0-browsers'
    entrypoint: bash
    args: ['scripts/gcp-ci-full.sh']
    # Substitutions are not step environment variables: pass the triggering branch for governance explicitly.
    env: ['FLOFI_SOURCE_SNAPSHOT_SHA256=${_SNAPSHOT_SHA256}', 'BRANCH_NAME=${_SOURCE_BRANCH}']
    waitFor: ['disposable-postgres']
# A prior attempt took 51 minutes. Complete coverage may take longer;
# the 180-minute timeout caps worker compute at USD 1.08 at USD 0.006/minute.
timeout: '10800s'
serviceAccount: 'projects/celtic-volt-418819/serviceAccounts/flofi-ci-runner@celtic-volt-418819.iam.gserviceaccount.com'
options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SNAPSHOT_SHA256: 'REQUIRED_AT_SUBMISSION'
  _SOURCE_BRANCH: 'claude/build-solana-transfer-ux-001'
