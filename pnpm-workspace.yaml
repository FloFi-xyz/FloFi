  - apps/reference-dapp
minimumReleaseAge: 10080
# Owner-approved Colosseum security waiver; remove after delivery.
# Metadata: docs/security/COLOSSEUM-DEPENDENCY-AGE-WAIVER.json
minimumReleaseAgeExclude:
  - source-map-js@1.2.2
pmOnFail: error
strictPeerDependencies: true
autoInstallPeers: false
